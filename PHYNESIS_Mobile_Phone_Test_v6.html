<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>PHYNESIS — Mobile Hero v6.0 | Refined Composition</title><style>
:root{--paper:#f7f6f3;--ink:#1b2544;--plum:#775b78}*{box-sizing:border-box}body{margin:0;background:#eae9e5;color:var(--ink);font-family:Arial,sans-serif}.screen{position:relative;margin:auto;width:min(100%,430px);min-height:100svh;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;align-items:center;box-shadow:0 5px 40px #1b254416}.top{z-index:2;display:flex;align-items:center;justify-content:space-between;width:100%;padding:22px 25px 0}.brand{font-family:Georgia,serif;font-size:17px;letter-spacing:.17em}.top small{font-size:8px;letter-spacing:.17em;color:#8b8e9c}.art{display:block;width:100%;max-height:calc(100svh - 72px);min-height:520px;flex:1;overflow:visible}.incoming{fill:none;stroke:#354575;stroke-width:1.15;opacity:.53;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.5s var(--delay) cubic-bezier(.2,.7,.3,1) forwards}.incoming:nth-child(3n){stroke:#775b78}.outflow{fill:none;stroke:#6d6988;stroke-width:2.25;opacity:.80;stroke-linecap:round;stroke-dasharray:750;stroke-dashoffset:750;animation:draw 3s 1.45s ease-in-out forwards}.form{opacity:0;animation:reveal .8s var(--delay) ease forwards}.mark{opacity:0;animation:reveal 1.1s 1.45s forwards}.micro{font-size:8px;letter-spacing:2.5px;fill:#82889b}.headline{font-family:Georgia,serif;font-size:28px;letter-spacing:-1px;fill:#1b2544}.subhead{font-family:Georgia,serif;font-size:28px;letter-spacing:-1px;fill:#775b78}.copy{opacity:0;animation:reveal .8s 2s forwards}.foot{position:absolute;bottom:15px;font:9px monospace;letter-spacing:.13em;color:#9c9dab;display:flex;width:100%;justify-content:space-between;padding:0 25px}button{border:0;background:transparent;color:#775b78;font:inherit;cursor:pointer}@keyframes draw{to{stroke-dashoffset:0}}@keyframes reveal{to{opacity:1}}@media(min-width:500px){.screen{margin:24px auto;min-height:720px;border-radius:18px}.art{max-height:760px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important}}
.olympus{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}.olympus img{width:100%;height:100%;object-fit:cover;object-position:center center;opacity:1;filter:none}.olympus:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,246,243,.03),rgba(247,246,243,.08) 42%,rgba(247,246,243,.16) 100%)}.top,.art,.foot{position:relative;z-index:1}.form circle{fill:#f7f6f3;fill-opacity:.88}.mobile-cta{fill:#775b78;font:600 15px Arial,sans-serif;letter-spacing:.2px}.mobile-cta:hover{opacity:.7}.mobile-cta:focus-visible{outline:2px solid #775b78}a:focus-visible{outline:2px solid #775b78}.services-overview{max-width:430px;margin:auto;padding:50px 28px 75px;background:#f7f6f3}.services-overview h2{font:28px Georgia,serif;color:#1b2544}.services-overview li{padding:10px 0;border-bottom:1px solid #d9d6d8;color:#354575}.services-overview ul{list-style:none;padding:0}.services-overview p{font-size:12px;color:#777}@media(max-height:720px){.art{min-height:510px}.top{padding-top:12px}.foot{bottom:8px}}

.brand-logo{width:128px;height:27px;object-fit:contain;object-position:left center;display:block}.top{padding-top:17px;min-height:43px}.outflow{stroke-width:2.5}.form circle{display:none}.mobile-cta{font-weight:600}.incoming{stroke-width:1.1}@media(max-width:390px){.brand-logo{width:116px}}

/* v5.4 — controlled color grade and mountain reposition */
.olympus{inset:24% 0 0;z-index:0;}
.olympus img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;opacity:.58;filter:none}
.olympus:after{background:linear-gradient(180deg,#f7f6f3 0%,rgba(247,246,243,.84) 11%,rgba(247,246,243,.32) 32%,rgba(247,246,243,.45) 61%,rgba(247,246,243,.74) 91%,#f7f6f3 100%)}
.top{padding:15px 24px 4px;min-height:58px;align-items:center;z-index:6}
.home-link{display:flex;align-items:center;width:168px;height:42px;overflow:visible;flex-shrink:0}
.brand-logo,.brand-logo:not([width]){width:166px;height:42px;max-width:100%;object-fit:contain;object-position:left center}
.menu-toggle{width:44px;height:44px;border:1px solid rgba(40,45,68,.3);border-radius:50%;font-size:23px;color:#242b46;display:grid;place-items:center;position:relative;z-index:8;background:rgba(247,246,243,.68)}
.mobile-nav{position:absolute;z-index:7;top:60px;left:14px;right:14px;background:rgba(247,246,243,.98);border:1px solid #dcd8df;border-radius:14px;padding:20px 25px;box-shadow:0 18px 38px #28304a20}
.mobile-nav[hidden]{display:none}.mobile-nav a{display:block;color:#28304a;text-decoration:none;font:26px Georgia,serif;padding:11px 4px;border-bottom:1px solid #ddd8df}.mobile-nav a:last-child{border:0}
@media(max-width:390px){.home-link{width:150px}.brand-logo,.brand-logo:not([width]){width:148px;height:40px}}

/* v5.5 — editorial-indigo and atmospheric-plum study */
:root{--paper:#f3f0ee;--ink:#242d4b;--plum:#79617f}
body{background:#e7e5e8}
.screen{background:radial-gradient(ellipse at 75% 72%,rgba(165,145,178,.13),transparent 47%),linear-gradient(180deg,#f4f1ee 0%,#f0eff1 59%,#f4f1ef 100%)}
.top{padding:15px 23px 5px;min-height:67px}
.home-link{width:181px;height:51px;overflow:visible;display:flex;align-items:center;justify-content:flex-start}
.brand-logo,.brand-logo:not([width]){width:181px;height:51px;object-fit:contain;object-position:left center;max-width:none;display:block}
.menu-toggle{background:rgba(246,243,242,.85);border-color:rgba(46,55,82,.43);color:#273350}
.olympus{inset:30% 0 0;z-index:0;}
.olympus img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;opacity:.78;filter:saturate(.96) contrast(1.08)}
.olympus:after{background:linear-gradient(180deg,#f3f0ee 0%,rgba(243,240,238,.91) 11%,rgba(243,240,238,.43) 27%,rgba(243,240,238,.36) 51%,rgba(243,240,238,.52) 73%,#f3f0ee 100%)}
.incoming{stroke:#3e507a;opacity:.57}
.incoming:nth-child(3n){stroke:#806b8c}
.outflow{stroke:#65668c;opacity:.92;stroke-width:2.7}
.form image{filter:saturate(1.25) contrast(1.2)}
.micro{fill:#6b6885}
.mobile-cta{fill:#665276}
.mobile-nav{background:rgba(246,243,243,.98)}
.foot{color:#827f91}
@media(max-width:390px){.home-link{width:165px}.brand-logo,.brand-logo:not([width]){width:165px;height:49px}}

/* v5.6 refinement */
.olympus{inset:24% 0 0}.olympus img{object-position:50% 47%;opacity:.83;filter:contrast(1.16) saturate(1.08)}.olympus:after{background:linear-gradient(180deg,#f3f0ee 0%,rgba(243,240,238,.85) 12%,rgba(243,240,238,.40) 33%,rgba(243,240,238,.37) 58%,rgba(243,240,238,.65) 86%,#f3f0ee 100%)}.incoming{stroke:#4b557e;opacity:.62}.incoming:nth-child(3n){stroke:#82668d}.outflow{stroke-width:2.7;opacity:.85}.art{min-height:560px}.mobile-cta{font-size:15px}.foot{pointer-events:none}.foot button{pointer-events:auto}
</style><style>/* v5.7: restrained atmospheric color and mountain prominence */
.olympus{inset:19% 0 0}
.olympus img{object-position:50% 58%;opacity:.92;filter:contrast(1.22) saturate(1.35) sepia(.08)}
.olympus:after{background:linear-gradient(180deg,#f3f0ee 0%,rgba(243,240,238,.88) 12%,rgba(236,235,244,.39) 32%,rgba(223,224,242,.22) 56%,rgba(235,226,240,.43) 80%,#f3f0ee 100%)}
.screen{background:linear-gradient(180deg,#f4f1ee 0%,#eeedf4 55%,#f2eef2 100%)}
.incoming{stroke:#4b557e;opacity:.65}
.incoming:nth-child(3n){stroke:#82668d}
.form image{filter:saturate(1.22) contrast(1.18)}
</style><style>/* v5.8 — quieter mountain, preserve approved visual rhythm */
.olympus{inset:19% 0 0}
.olympus img{object-position:50% 56%;opacity:.64;filter:contrast(1.08) saturate(1.18) sepia(.04)}
.olympus:after{background:linear-gradient(180deg,#f3f0ee 0%,rgba(243,240,238,.92) 12%,rgba(242,239,243,.67) 31%,rgba(239,237,246,.59) 54%,rgba(240,234,243,.69) 78%,#f3f0ee 100%)}
.screen{background:radial-gradient(ellipse at 55% 74%,rgba(130,108,160,.11),transparent 58%),linear-gradient(180deg,#f4f1ee 0%,#eeedf4 60%,#f2eef2 100%)}
.form image{filter:saturate(1.14) contrast(1.09)}
/* Prevent background image from dominating text and service icons */
.copy{filter:drop-shadow(0 1px 2px rgba(246,243,243,.35))}
</style><style id="v6-refinements">
/* v6.0: retain approved visual assets and six-form wave concept. */
.olympus img{opacity:.67;filter:contrast(1.13) saturate(1.16) sepia(.035)}
.olympus:after{background:linear-gradient(180deg,#f3f0ee 0%,rgba(243,240,238,.92) 12%,rgba(242,239,243,.69) 31%,rgba(239,237,246,.54) 54%,rgba(240,234,243,.66) 78%,#f3f0ee 100%)}

.outflow{stroke-width:2.2;opacity:.83}
.form image{filter:saturate(1.13) contrast(1.10)}
.mobile-cta{cursor:pointer}
